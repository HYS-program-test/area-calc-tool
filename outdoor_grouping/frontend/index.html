<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
:root {
  --blue: #2563eb;
  --blue-pale: #eff6ff;
  --border: #e5e7eb;
  --text: #1f2937;
  --muted: #6b7280;
}
html,body{margin:0;padding:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:#fff;color:var(--text)}
.hint{font-size:12px;color:var(--muted);padding:4px 2px 10px 2px;line-height:1.6}

#stage{ position:relative; overflow-y:auto; max-height:520px; border:1px solid var(--border); border-radius:10px; }

table{ width:100%; border-collapse:collapse; font-size:13px; }
th{
  position:sticky; top:0; background:#f9fafb; text-align:left; padding:8px 10px;
  border-bottom:1px solid var(--border); font-size:12px; color:var(--muted); z-index:2;
}
td{ padding:8px 10px; border-bottom:1px solid #f1f3f5; vertical-align:middle; }

.room-row td.name-cell{ cursor:pointer; transition: background .12s; }
.room-row.group-start td.name-cell{ cursor:default; font-weight:600; }
.room-row:not(.group-start) td.name-cell:hover{ background:var(--blue-pale); }

.merge-cell{
  text-align:center; border-left:1px solid var(--border);
  background:#fafcff;
}
.merge-cell .model{ font-weight:700; color:var(--text); }
.merge-cell .rate{ font-size:12px; color:var(--muted); margin-top:2px; }
.merge-cell .rate.warn{ color:#b45309; }
.merge-cell .empty{ color:#c7ccd1; font-size:12px; }

.divider-row td{ padding:0; border-bottom:none; }
.divider-bar{
  position:relative; height:16px; display:flex; align-items:center; justify-content:center;
}
.divider-bar::before{
  content:""; position:absolute; left:8px; right:8px; top:50%; border-top:2px dashed var(--blue);
}
.divider-handle{
  position:relative; width:20px; height:20px; border-radius:50%; background:#fff;
  border:2px solid var(--blue); color:var(--blue); font-size:11px; display:flex;
  align-items:center; justify-content:center; cursor:grab; user-select:none; z-index:3;
}
.divider-handle:active{ cursor:grabbing; }
.divider-handle .x{
  position:absolute; top:-24px; left:50%; transform:translateX(-50%);
  width:16px; height:16px; border-radius:50%; background:#fff; color:#b3453b;
  border:1px solid #e2b8b8; font-size:10px; line-height:14px; text-align:center; display:none;
}
.divider-bar:hover .x{ display:block; }

#draghint{
  position:absolute; left:0; right:0; height:0; border-top:3px dashed var(--blue);
  pointer-events:none; display:none; z-index:10;
}
</style>
</head>
<body>

<div class="hint">同一組（合併儲存格）共用同一台室外機，連結率會依分組即時重算。點房間名稱可以新增分組；虛線把手可拖曳調整分組範圍，點把手上方的 × 可以合併（取消該處分組）。</div>
<div id="stage">
  <table>
    <thead><tr><th>房間</th><th style="text-align:center">室外機型號／連結率</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="draghint"></div>
</div>

<script>
const RENDER_EVENT = "streamlit:render";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*");
}
function componentReady() { postToStreamlit("streamlit:componentReady", { apiVersion: 1 }); }
function setComponentValue(value) { postToStreamlit("streamlit:setComponentValue", { value }); }
function setFrameHeight(height = 560) { postToStreamlit("streamlit:setFrameHeight", { height }); }

let rows = []; // [{index, label, isSplit, outdoorModel, connectionRate}]
let dragging = null;
let pendingTargetIndex = null;

const stage = document.getElementById("stage");
const tbody = document.getElementById("tbody");
const draghint = document.getElementById("draghint");

function send() {
  const splits = rows
    .filter(r => r.isSplit)
    .map(r => ({ index: r.index }))
    .sort((a, b) => a.index - b.index);
  setComponentValue({ splits });
}

function groupsFromRows() {
  const groups = [];
  rows.forEach((r, i) => {
    if (r.isSplit || i === 0) {
      groups.push({ startIndex: r.index, items: [r] });
    } else {
      groups[groups.length - 1].items.push(r);
    }
  });
  return groups;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}

function render() {
  tbody.innerHTML = "";
  const groups = groupsFromRows();

  groups.forEach((group, gIdx) => {
    if (gIdx !== 0) {
      const trDivider = document.createElement("tr");
      trDivider.className = "divider-row";
      trDivider.innerHTML = `<td colspan="2"></td>`;
      const cell = trDivider.querySelector("td");
      const bar = document.createElement("div");
      bar.className = "divider-bar";

      const handle = document.createElement("div");
      handle.className = "divider-handle";
      handle.textContent = "⠿";
      handle.dataset.index = group.startIndex;
      handle.addEventListener("mousedown", onHandleMouseDown);

      const xBtn = document.createElement("div");
      xBtn.className = "x";
      xBtn.textContent = "×";
      xBtn.title = "合併（取消此處分組）";
      xBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        const target = rows.find(r => r.index === group.startIndex);
        if (target) target.isSplit = false;
        render();
        send();
      });
      handle.appendChild(xBtn);
      bar.appendChild(handle);
      cell.appendChild(bar);
      tbody.appendChild(trDivider);
    }

    group.items.forEach((r, iInGroup) => {
      const tr = document.createElement("tr");
      tr.className = "room-row" + (iInGroup === 0 ? " group-start" : "");
      tr.dataset.index = r.index;

      const nameTd = document.createElement("td");
      nameTd.className = "name-cell";
      nameTd.textContent = r.label;
      nameTd.title = iInGroup !== 0 ? "點擊：在此新增分組" : "";
      if (iInGroup !== 0) {
        nameTd.addEventListener("click", () => {
          r.isSplit = true;
          render();
          send();
        });
      }
      tr.appendChild(nameTd);

      if (iInGroup === 0) {
        const mergeTd = document.createElement("td");
        mergeTd.className = "merge-cell";
        mergeTd.rowSpan = group.items.length;
        if (r.outdoorModel) {
          const rateText = (r.connectionRate === null || r.connectionRate === undefined)
            ? ""
            : `連結率 ${r.connectionRate.toFixed(1)}%`;
          const rateClass = (r.connectionRate !== null && r.connectionRate !== undefined
            && (r.connectionRate < 100 || r.connectionRate > 130)) ? "rate warn" : "rate";
          mergeTd.innerHTML = `
            <div class="model">${escapeHtml(r.outdoorModel)}</div>
            <div class="${rateClass}">${escapeHtml(rateText)}</div>
          `;
        } else {
          mergeTd.innerHTML = `<div class="empty">尚無推薦室外機</div>`;
        }
        tr.appendChild(mergeTd);
      }

      tbody.appendChild(tr);
    });
  });

  setFrameHeight(Math.max(200, document.body.scrollHeight + 20));
}

function rowRects() {
  return Array.from(tbody.querySelectorAll(".room-row")).map(el => {
    const rect = el.getBoundingClientRect();
    return { index: Number(el.dataset.index), top: rect.top, cy: rect.top + rect.height / 2 };
  });
}

function onHandleMouseDown(e) {
  const originIndex = Number(e.currentTarget.dataset.index);
  dragging = { originIndex };
  pendingTargetIndex = null;
  draghint.style.display = "block";
  document.addEventListener("mousemove", onDragMove);
  document.addEventListener("mouseup", onDragEnd);
  e.preventDefault();
  e.stopPropagation();
}

function onDragMove(e) {
  if (!dragging) return;
  const rects = rowRects().filter(r => r.index !== 0);
  if (!rects.length) return;

  let nearest = rects[0];
  let best = Infinity;
  rects.forEach(r => {
    const d = Math.abs(r.cy - e.clientY);
    if (d < best) { best = d; nearest = r; }
  });
  pendingTargetIndex = nearest.index;

  const stageRect = stage.getBoundingClientRect();
  draghint.style.top = `${nearest.top - stageRect.top + stage.scrollTop - 2}px`;
}

function onDragEnd() {
  document.removeEventListener("mousemove", onDragMove);
  document.removeEventListener("mouseup", onDragEnd);
  draghint.style.display = "none";

  if (dragging && pendingTargetIndex !== null) {
    const origin = rows.find(r => r.index === dragging.originIndex);
    const target = rows.find(r => r.index === pendingTargetIndex);

    if (origin && target && target.index !== 0) {
      if (!target.isSplit || target.index === origin.index) {
        if (origin.index !== 0) origin.isSplit = false;
        target.isSplit = true;
        render();
        send();
      }
    }
  }
  dragging = null;
  pendingTargetIndex = null;
}

window.addEventListener("message", (event) => {
  const data = event.data;
  if (!data || data.type !== RENDER_EVENT || !data.args) return;

  const args = data.args;
  rows = (args.rows || []).map(r => ({
    index: r.index,
    label: r.label || "",
    isSplit: !!r.is_split,
    outdoorModel: r.outdoor_model || "",
    connectionRate: (r.connection_rate === undefined) ? null : r.connection_rate,
  }));

  render();
});

componentReady();
setFrameHeight(560);
</script>
</body>
</html>
