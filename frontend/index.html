<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
html,body{margin:0;padding:0;font-family:Arial,"Microsoft JhengHei",sans-serif;background:white;color:#1f2937}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:8px}
button{padding:7px 10px;border:1px solid #d1d5db;border-radius:7px;background:white;cursor:pointer}
button.active{border-color:#2563eb;background:#eff6ff;color:#2563eb}
.color{width:28px;height:28px;padding:0}
.stage{overflow:auto;border:1px solid #e5e7eb;border-radius:8px;height:610px;background:#fafafa}
.canvas-holder{position:relative;transform-origin:top left}
canvas{position:absolute;left:0;top:0}
.small{font-size:13px;color:#6b7280}
</style>
</head>
<body>
<div class="toolbar">
  <button id="selectBtn" class="active">選取／移動／拖曳角點調整</button>
  <button id="addBtn">新增</button>
  <button id="deleteBtn">刪除</button>
  <button id="stretchBtn">整體放大10%</button>
  <span>改色</span>
  <button class="color" data-color="#ef4444" style="background:#ef4444"></button>
  <button class="color" data-color="#f97316" style="background:#f97316"></button>
  <button class="color" data-color="#f59e0b" style="background:#f59e0b"></button>
  <button class="color" data-color="#22c55e" style="background:#22c55e"></button>
  <button class="color" data-color="#3b82f6" style="background:#3b82f6"></button>
  <button class="color" data-color="#a855f7" style="background:#a855f7"></button>
  <span class="small">縮放</span>
  <button id="minusBtn">－</button>
  <strong id="zoomLabel">60%</strong>
  <button id="plusBtn">＋</button>
  <button id="resetBtn">重置 60%</button>
</div>

<div class="stage">
  <div class="canvas-holder" id="holder">
    <canvas id="bg"></canvas>
    <canvas id="fg"></canvas>
  </div>
</div>

<script>
const STREAMLIT_MESSAGE_TYPE = "streamlit:componentReady";
const RENDER_EVENT = "streamlit:render";
const SET_VALUE = "streamlit:setComponentValue";
const SET_HEIGHT = "streamlit:setFrameHeight";

function postToStreamlit(type, payload = {}) {
  window.parent.postMessage(
    { isStreamlitMessage: true, type, ...payload },
    "*"
  );
}

function componentReady() {
  postToStreamlit(STREAMLIT_MESSAGE_TYPE, { apiVersion: 1 });
}

function setComponentValue(value) {
  postToStreamlit(SET_VALUE, { value });
}

function setFrameHeight(height = 700) {
  postToStreamlit(SET_HEIGHT, { height });
}

// 保險機制：元件剛掛載時，第一次的「調整高度」訊息偶爾會因為 Streamlit 那邊
// 還沒完成註冊而被忽略（瀏覽器主控台會看到 "unregistered ComponentInstance" 警告），
// 導致畫面容器維持在很小的高度、內容看起來像消失了。改成載入後短時間內重複補送幾次，
// 就算第一次被漏接，後面幾次也會補上。
function scheduleHeightRetries(getHeight) {
  [50, 150, 400, 800, 1500].forEach(delay => {
    setTimeout(() => setFrameHeight(getHeight()), delay);
  });
}

let rooms = [];
let zoom = 0.60;
let mode = "select";
let selected = 0;
let dragTarget = null; // {type:"vertex", vertexIndex} 或 {type:"move", last:{x,y}}
let addStart = null;

const VERTEX_HIT_RADIUS = 12; // canvas 座標空間的像素容許誤差（跟 zoom 無關，pointerPosition 已經除過 zoom）
const VERTEX_HOVER_RADIUS = 12;

const holder = document.getElementById("holder");
const bg = document.getElementById("bg");
const fg = document.getElementById("fg");
const bctx = bg.getContext("2d");
const fctx = fg.getContext("2d");
const image = new Image();

function send() {
  setComponentValue({ rooms, zoom });
}

function normToPx(p) {
  return { x: p.x / 1000 * fg.width, y: p.y / 1000 * fg.height };
}

function pxToNorm(p) {
  return { x: p.x / fg.width * 1000, y: p.y / fg.height * 1000 };
}

function centroid(room) {
  const pts = room.points.map(normToPx);
  return {
    x: pts.reduce((sum, p) => sum + p.x, 0) / pts.length,
    y: pts.reduce((sum, p) => sum + p.y, 0) / pts.length
  };
}

function applyZoom(notify = true) {
  holder.style.transform = `scale(${zoom})`;
  holder.style.width = `${image.width * zoom}px`;
  holder.style.height = `${image.height * zoom}px`;
  document.getElementById("zoomLabel").textContent =
    `${Math.round(zoom * 100)}%`;
  if (notify) send();
}

function draw() {
  fctx.clearRect(0, 0, fg.width, fg.height);

  rooms.forEach((room, index) => {
    const pts = room.points.map(normToPx);
    if (pts.length < 3) return;

    fctx.beginPath();
    fctx.moveTo(pts[0].x, pts[0].y);
    pts.slice(1).forEach(p => fctx.lineTo(p.x, p.y));
    fctx.closePath();

    fctx.globalAlpha = 0.18;
    fctx.fillStyle = room.color || "#ef4444";
    fctx.fill();
    fctx.globalAlpha = 1;

    fctx.lineWidth = index === selected ? 7 : 4;
    fctx.strokeStyle = room.color || "#ef4444";
    fctx.stroke();

    const c = centroid(room);
    fctx.fillStyle = "#111";
    fctx.font = "bold 22px Arial";
    fctx.fillText(room.name || `區域${room.id}`, c.x - 35, c.y);

    if (index === selected) {
      pts.forEach((p, vertexIndex) => {
        const isDragging = dragTarget
          && dragTarget.type === "vertex"
          && dragTarget.vertexIndex === vertexIndex;
        fctx.fillStyle = isDragging ? "#2563eb" : "white";
        fctx.fillRect(p.x - 7, p.y - 7, 14, 14);
        fctx.strokeStyle = "#2563eb";
        fctx.lineWidth = 2;
        fctx.strokeRect(p.x - 7, p.y - 7, 14, 14);
      });
    }
  });
}

function pointInPoly(pt, room) {
  const vs = room.points.map(normToPx);
  let inside = false;

  for (let i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    const xi = vs[i].x, yi = vs[i].y;
    const xj = vs[j].x, yj = vs[j].y;
    const intersect =
      ((yi > pt.y) !== (yj > pt.y)) &&
      (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointerPosition(event) {
  const rect = fg.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) / zoom,
    y: (event.clientY - rect.top) / zoom
  };
}

function findVertexAt(room, p) {
  const pts = room.points.map(normToPx);
  for (let i = 0; i < pts.length; i++) {
    const dx = p.x - pts[i].x;
    const dy = p.y - pts[i].y;
    if (Math.hypot(dx, dy) <= VERTEX_HIT_RADIUS) {
      return i;
    }
  }
  return -1;
}

fg.addEventListener("mousedown", event => {
  const p = pointerPosition(event);

  if (mode === "add") {
    addStart = p;
    return;
  }

  // 先檢查是不是點到目前選取房間的角落控制點（拖曳調整大小/形狀用）
  if (rooms[selected]) {
    const vertexIndex = findVertexAt(rooms[selected], p);
    if (vertexIndex !== -1) {
      dragTarget = { type: "vertex", vertexIndex };
      return;
    }
  }

  // 沒點到控制點，才檢查是否點進某個房間本體（移動整個形狀）
  for (let i = rooms.length - 1; i >= 0; i--) {
    if (pointInPoly(p, rooms[i])) {
      selected = i;
      dragTarget = { type: "move", last: p };
      draw();
      return;
    }
  }
});

fg.addEventListener("mousemove", event => {
  if (mode !== "select") return;
  const p = pointerPosition(event);

  // 滑鼠移到控制點附近時換成調整大小的游標，提示可以拖曳
  if (!dragTarget && rooms[selected]) {
    const hoverIndex = findVertexAt(rooms[selected], p);
    fg.style.cursor = hoverIndex !== -1 ? "nwse-resize" : "default";
  }

  if (!dragTarget || !rooms[selected]) return;

  if (dragTarget.type === "vertex") {
    rooms[selected].points[dragTarget.vertexIndex] = pxToNorm(p);
    draw();
    send();
    return;
  }

  // type === "move"：拖曳空間內部，整個形狀平移
  const dx = p.x - dragTarget.last.x;
  const dy = p.y - dragTarget.last.y;

  rooms[selected].points = rooms[selected].points.map(point => {
    const px = normToPx(point);
    return pxToNorm({ x: px.x + dx, y: px.y + dy });
  });

  dragTarget.last = p;
  draw();
  send();
});

fg.addEventListener("mouseup", event => {
  const p = pointerPosition(event);

  if (mode === "add" && addStart) {
    const x1 = Math.min(addStart.x, p.x);
    const y1 = Math.min(addStart.y, p.y);
    const x2 = Math.max(addStart.x, p.x);
    const y2 = Math.max(addStart.y, p.y);

    if (x2 - x1 > 20 && y2 - y1 > 20) {
      const id = rooms.length
        ? Math.max(...rooms.map(room => room.id)) + 1
        : 1;

      rooms.push({
        id,
        name: `區域${id}`,
        room_type: "一般辦公室",
        confidence: 1,
        color: "#3b82f6",
        unit_load: 120,
        included: true,
        points: [
          pxToNorm({ x: x1, y: y1 }),
          pxToNorm({ x: x2, y: y1 }),
          pxToNorm({ x: x2, y: y2 }),
          pxToNorm({ x: x1, y: y2 })
        ]
      });
      selected = rooms.length - 1;
    }

    addStart = null;
    mode = "select";
    selectBtn.classList.add("active");
    addBtn.classList.remove("active");
    draw();
    send();
  }

  dragTarget = null;
});

selectBtn.onclick = () => {
  mode = "select";
  selectBtn.classList.add("active");
  addBtn.classList.remove("active");
};

addBtn.onclick = () => {
  mode = "add";
  addBtn.classList.add("active");
  selectBtn.classList.remove("active");
};

deleteBtn.onclick = () => {
  if (!rooms.length) return;
  rooms.splice(selected, 1);
  selected = Math.max(0, selected - 1);
  draw();
  send();
};

stretchBtn.onclick = () => {
  if (!rooms[selected]) return;
  const c = centroid(rooms[selected]);

  rooms[selected].points = rooms[selected].points.map(point => {
    const p = normToPx(point);
    return pxToNorm({
      x: c.x + (p.x - c.x) * 1.10,
      y: c.y + (p.y - c.y) * 1.10
    });
  });

  draw();
  send();
};

document.querySelectorAll(".color").forEach(button => {
  button.onclick = () => {
    if (!rooms[selected]) return;
    rooms[selected].color = button.dataset.color;
    draw();
    send();
  };
});

minusBtn.onclick = () => {
  zoom = Math.max(0.20, zoom - 0.10);
  applyZoom();
};

plusBtn.onclick = () => {
  zoom = Math.min(1.50, zoom + 0.10);
  applyZoom();
};

resetBtn.onclick = () => {
  zoom = 0.60;
  applyZoom();
};

window.addEventListener("message", event => {
  const data = event.data;

  if (
    !data ||
    data.type !== RENDER_EVENT ||
    !data.args
  ) {
    return;
  }

  const args = data.args;
  rooms = JSON.parse(JSON.stringify(args.rooms || []));
  zoom = Number(args.zoom || 0.60);

  image.onload = () => {
    bg.width = fg.width = image.width;
    bg.height = fg.height = image.height;
    holder.style.width = `${image.width}px`;
    holder.style.height = `${image.height}px`;
    bctx.clearRect(0, 0, bg.width, bg.height);
    bctx.drawImage(image, 0, 0);
    applyZoom(false);
    draw();
    setFrameHeight(700);
    scheduleHeightRetries(() => 700);
  };

  image.src = args.image_data_url;
});

componentReady();
setFrameHeight(700);
scheduleHeightRetries(() => 700);
</script>
</body>
</html>
